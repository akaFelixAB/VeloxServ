header:
  license:
    spdx-id: Apache-2.0
    copyright-owner: Apache Software Foundation

  paths-ignore:
    - 'dist'
    - 'licenses'
    - '**/*.md'
    - '**/*.yaml'
    - '**/*.yml'
    - '**/*.json'
    - '**/*.xml'
    - '**/*.toml'
    - 'LICENSE'
    - 'NOTICE'
    - '.git/**'
    - 'build/**'
    - 'public/**'

  comment: on-failure